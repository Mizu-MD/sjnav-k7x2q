<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#e8f4ff;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(51,233,255,.28);box-shadow:0 0 18px rgba(51,233,255,.12),inset 0 0 14px rgba(255,61,242,.05)}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0a1030,#04050c);z-index:50;transition:opacity .5s}
#load.off{opacity:0;pointer-events:none}
#load h1{font-size:26px;letter-spacing:.14em;margin:0 0 10px;color:var(--c);text-shadow:0 0 14px var(--c),0 0 36px var(--m)}
#loadmsg{opacity:.8}
#top{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));right:68px;z-index:10}
#q{width:100%;padding:12px 14px;border-radius:14px;font-size:16px;color:#fff;outline:none}
#q::placeholder{color:#7fb0c8}
#res{margin-top:6px;border-radius:12px;overflow:hidden}
#res div{padding:11px 14px;border-top:1px solid rgba(51,233,255,.15);background:rgba(8,12,28,.92)}
#res div small{opacity:.7}#res div:active{background:rgba(51,233,255,.2)}
#side{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px;z-index:10}

.fab:active{filter:brightness(1.6)}
#banner{position:fixed;left:50%;transform:translate(-50%,-140%);top:max(10px,env(safe-area-inset-top));width:min(560px,calc(100% - 20px));padding:12px 16px;border-radius:18px;display:flex;align-items:center;gap:14px;z-index:20;transition:transform .35s}

.ln.on{color:#fff;border-color:var(--c);background:rgba(51,233,255,.2);box-shadow:0 0 12px rgba(51,233,255,.55);text-shadow:0 0 8px var(--c)}
#banner.on{transform:translate(-50%,62px)}
#bGlyph{font-size:44px;line-height:1;color:var(--c);text-shadow:0 0 14px var(--c);width:52px;text-align:center}
#bText{font-size:18px;font-weight:600}#bDist{font-size:24px;font-weight:700;color:var(--m);text-shadow:0 0 12px var(--m)}
#sheet{position:fixed;left:50%;transform:translate(-50%,160%);bottom:max(12px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));padding:14px 16px;border-radius:20px;z-index:20;transition:transform .35s;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#sheet.on{transform:translate(-50%,0)}
#sTitle{font-size:18px;font-weight:700;flex:1 1 100%}#sInfo{flex:1 1 100%;opacity:.85;margin-top:-4px}
.btn{padding:11px 18px;border-radius:12px;font-size:16px;font-weight:700;border:0;color:#04050c;background:var(--c);box-shadow:0 0 14px rgba(51,233,255,.55);cursor:pointer}
.btn.alt{background:var(--m);box-shadow:0 0 14px rgba(255,61,242,.55)}.btn.ghost{background:transparent;color:#cfe;border:1px solid rgba(255,255,255,.3);box-shadow:none}
#rep{position:fixed;right:68px;top:max(10px,env(safe-area-inset-top));display:none;gap:8px;z-index:12;flex-direction:column;padding:10px;border-radius:14px;margin-top:58px;max-height:calc(var(--vh,100vh) - 80px);overflow-y:auto}
#rep.on{display:flex}#rep button{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;text-align:left}
#rep small{opacity:.6;font-size:11px;max-width:170px}
#lay{position:fixed;right:68px;top:max(10px,env(safe-area-inset-top));display:none;flex-direction:column;gap:9px;z-index:12;padding:12px 14px;border-radius:14px;margin-top:58px;max-width:min(300px,calc(100% - 90px));max-height:calc(var(--vh,100vh) - 80px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}#lay.on{display:flex}#lay label{display:flex;gap:8px;align-items:center;font-size:14px}#lay input{width:18px;height:18px;accent-color:#33e9ff}#lay small{opacity:.65;font-size:11px}.lrow{display:flex;gap:8px}.lrow button{flex:1;padding:7px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 110px);transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:12px;background:rgba(8,12,28,.95);border:1px solid var(--c);z-index:30;transition:.3s;max-width:90%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hud{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:9;font-size:12px;color:#9fd;pointer-events:none;opacity:.9}
#hud #style{display:inline-block;padding:2px 8px;border-radius:8px;border:1px solid var(--c);color:var(--c);margin-bottom:4px;letter-spacing:.1em}
#scale{display:flex;align-items:center;gap:6px}#scale div{height:3px;background:var(--c);box-shadow:0 0 6px var(--c)}
#legend{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:9;font-size:10px;color:#9fd;opacity:.6;text-align:right;pointer-events:none;max-width:60%}
#sheet.on ~ #hud,#sheet.on ~ #legend{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 120px)}
#side{max-height:calc(var(--vh,100vh) - 20px);flex-flow:column wrap;justify-content:flex-start;align-content:flex-end}
#rcw{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);display:none;gap:10px;z-index:21}#rcw.on{display:flex}#rcw button{padding:11px 16px;border-radius:14px;color:#fff;font-size:15px;border:1px solid rgba(51,233,255,.6)}#rcB{background:rgba(255,61,242,.45)!important}
#spd{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px);display:none;gap:8px;align-items:flex-end;z-index:9;pointer-events:none}

#spdL{width:54px;padding:4px 2px 5px;border-radius:8px;background:#fff;color:#111;border:3px solid #111;outline:2px solid #fff;text-align:center;line-height:1}#spdL small{display:block;font-size:8px;font-weight:700}#spdL b{font-size:23px;display:block;margin-top:2px}#spdL.est{opacity:.78}#spdL.over{background:#ffdcdc;border-color:#d00;outline-color:#d00;color:#d00}
