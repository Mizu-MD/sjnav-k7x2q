<style>
:root{--c:#33e9ff;--m:#ff3df2;--bg:#04050c;--glass:rgba(8,12,28,.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#e8f4ff;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(51,233,255,.28);box-shadow:0 0 18px rgba(51,233,255,.12),inset 0 0 14px rgba(255,61,242,.05)}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0a1030,#04050c);z-index:50;transition:opacity .5s}

#load h1{font-size:26px;letter-spacing:.14em;margin:0 0 10px;color:var(--c);text-shadow:0 0 14px var(--c),0 0 36px var(--m)}
#loadmsg{opacity:.8}
#top{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));right:68px;z-index:10}
#q{width:100%;padding:12px 14px;border-radius:14px;font-size:16px;color:#fff;outline:none}
#q::placeholder{color:#7fb0c8}
#res{margin-top:6px;border-radius:12px;overflow:hidden}
#res div{padding:11px 14px;border-top:1px solid rgba(51,233,255,.15);background:rgba(8,12,28,.92)}
#res div small{opacity:.7}#res div:active{background:rgba(51,233,255,.2)}
#side{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px;z-index:10}
.fab{width:48px;height:48px;border-radius:14px;font-size:22px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.fab:active{filter:brightness(1.6)}
#banner{position:fixed;left:50%;transform:translate(-50%,-140%);top:max(10px,env(safe-area-inset-top));width:min(560px,calc(100% - 20px));padding:12px 16px;border-radius:18px;display:flex;align-items:center;gap:14px;z-index:20;transition:transform .35s}
#lanes{position:fixed;left:50%;transform:translate(-50%,-300%);top:max(10px,env(safe-area-inset-top));padding:8px 12px;border-radius:14px;display:flex;gap:6px;z-index:19;transition:transform .3s;pointer-events:none}
#lanes.on{transform:translate(-50%,138px)}
.ln{min-width:38px;height:46px;border-radius:8px;border:1px solid rgba(120,160,200,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;color:rgba(200,225,255,.45);background:rgba(10,16,34,.5)}
.ln.on{color:#fff;border-color:var(--c);background:rgba(51,233,255,.2);box-shadow:0 0 12px rgba(51,233,255,.55);text-shadow:0 0 8px var(--c)}
#banner.on{transform:translate(-50%,62px)}
#bGlyph{font-size:44px;line-height:1;color:var(--c);text-shadow:0 0 14px var(--c);width:52px;text-align:center}
#bText{font-size:18px;font-weight:600}#bDist{font-size:24px;font-weight:700;color:var(--m);text-shadow:0 0 12px var(--m)}
#sheet{position:fixed;left:50%;transform:translate(-50%,160%);bottom:max(12px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));padding:14px 16px;border-radius:20px;z-index:20;transition:transform .35s;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#sheet.on{transform:translate(-50%,0)}
#sTitle{font-size:18px;font-weight:700;flex:1 1 100%}#sInfo{flex:1 1 100%;opacity:.85;margin-top:-4px}
.btn{padding:11px 18px;border-radius:12px;font-size:16px;font-weight:700;border:0;color:#04050c;background:var(--c);box-shadow:0 0 14px rgba(51,233,255,.55);cursor:pointer}
.btn.alt{background:var(--m);box-shadow:0 0 14px rgba(255,61,242,.55)}.btn.ghost{background:transparent;color:#cfe;border:1px solid rgba(255,255,255,.3);box-shadow:none}

#rep.on{display:flex}#rep button{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;text-align:left}
